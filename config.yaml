  broker_host: "localhost"
  broker_port: 1883
  username: ""
  password: ""
  client_id: "plattenwechsler-pi"
  base_topic: "plattenwechsler"
  qos: 1
  retain_status: true
  reconnect_intervall_s: 5.0

